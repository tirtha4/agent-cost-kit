[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-kit"
version = "1.0.0"
description = "Seven ways to cut an AI agent's API bill without changing models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "tirthaexe" }]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
examples = ["anthropic"]

[project.urls]
Homepage = "https://github.com/tirtha4/agent-cost-kit"

[tool.setuptools.packages.find]
where = ["python"]
include = ["agent_cost*"]
